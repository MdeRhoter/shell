name: Check formatting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-qml:
    runs-on: ubuntu-latest
    container:
      # Lowercase literal for the same reason build-arch.yml hardcodes it:
      # jobs.<id>.container.image is evaluated before any step runs, so the
      # downcase-in-a-step trick from update-image.yml cannot apply here.
      image: ghcr.io/mderhoter/shell-arch-env:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check QML format
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmlformat --version
          for file in (string match -v 'build/*' **.qml)
            /usr/lib/qt6/bin/qmlformat $file | diff -u $file - || exit 1
          end
          python3 scripts/qml-lint-conventions.py

  check-cpp:
    runs-on: ubuntu-latest
    container:
      # Lowercase literal, same reason as above.
      image: ghcr.io/mderhoter/shell-arch-env:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check C++ format
        shell: fish {0}
        run: |
          clang-format --version
          find plugin extras -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror
