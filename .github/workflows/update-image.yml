name: Update Docker CI image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  packages: write

concurrency:
  group: update-docker-ci-image
  cancel-in-progress: true

# Overwritten at runtime by the "Lowercase the image owner" step below; kept
# here so the image name is visible without reading the job.
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shell-arch-env

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI repository names must be lowercase, and the owner here is
      # "MdeRhoter" -- so interpolating github.repository_owner straight into
      # the tag produced `ghcr.io/MdeRhoter/shell-arch-env:latest`, which buildx
      # rejects outright: "invalid tag ...: repository name must be lowercase".
      # That blocked the first publish (run 32629258561, 2026-08-23, failed in
      # 10s); with this step the re-dispatch 5 minutes later published the image
      # and it has existed since, which is what build-arch.yml has been pulling.
      # Actions has no lowercase expression function, hence the step.
      - name: Lowercase the image owner
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shell-arch-env" >> "$GITHUB_ENV"

      - name: Write Dockerfile
        run: |
          cat > /tmp/Dockerfile <<EOF
          FROM archlinux:latest
          RUN pacman -Syu --needed --noconfirm sudo base-devel cmake ninja fish git clazy qt6-declarative qt6-shadertools python libpipewire aubio libqalculate && \
              useradd -m builder && \
              echo 'builder ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers && \
              sudo -u builder git clone https://aur.archlinux.org/yay-bin.git /home/builder/yay-bin && \
              cd /home/builder/yay-bin && \
              sudo -u builder makepkg -si --noconfirm && \
              sudo -u builder yay -S --noconfirm quickshell-git libcava qt6-m3shapes-git && \
              sudo -u builder yay -Yc --noconfirm && \
              pacman -Rns --noconfirm yay-bin && \
              sed -i '/builder ALL=(ALL) NOPASSWD:ALL/d' /etc/sudoers && \
              userdel -r builder && \
              pacman -Scc --noconfirm
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: /tmp/Dockerfile
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
