# ccache settings for the caelestia plugin build. Vendored so both machines get
# them; ./update installs this to ~/.config/ccache/ccache.conf.
#
# sloppiness is the ONLY line here that is load-bearing, and it is the reason a
# naive `pacman -S ccache` buys you almost nothing on this project. The plugin
# build uses precompiled headers (cmake_pch.hxx.gch per target), and by default
# ccache refuses to cache any compilation that consumes a PCH: it cannot prove
# the .gch was built with identical -D flags, and __TIME__/__DATE__ inside the
# Qt headers make every PCH textually unique. The result is a ~0% hit rate,
# which reads as "ccache does not help here" rather than "ccache is misconfigured".
#
#   pch_defines  - trust that a PCH built by this same cmake run matches the
#                  -D flags of the TUs using it. True for us: one cmake
#                  configure generates both.
#   time_macros  - ignore __TIME__/__DATE__/__TIMESTAMP__ when hashing. The
#                  plugin does not embed a build timestamp anywhere that
#                  matters (the version marker is a git revision, baked in by
#                  cmake, not by the preprocessor).
sloppiness = pch_defines,time_macros

# 5G holds several full builds plus the Qt PCHs, which are large. Sized against
# 97G free; drop it if the laptop gets tight.
max_size = 5G

# Trades a little CPU for a lot of disk. On 4 cores the compile is the
# bottleneck, not zstd, and a smaller cache means more variants stay resident.
compression = true
compression_level = 1

# --- cross-machine settings ------------------------------------------------
# These three cost nothing locally and are what make a cache entry produced on
# one machine usable on another. They are set unconditionally so that the local
# cache is already populated in the shared format BEFORE remote_storage is
# turned on — flipping them later would orphan every existing entry.
#
# compiler_check is the one that actually decides whether sharing works at all.
# The default is `mtime`, which folds the compiler binary's modification time
# into the hash. Two machines that installed the identical gcc package still
# have different mtimes for /usr/bin/g++, so the default guarantees a 100% miss
# rate across machines while looking perfectly healthy locally. Hashing the
# compiler's CONTENT instead means same package version == same hash.
compiler_check = content

# Rewrite absolute paths under /home into paths relative to the build
# directory, so this laptop's /home/martijn/.config/quickshell/caelestia and the
# cluster job's /workspace hash identically. Paths outside base_dir (notably
# /usr/include/qt6) stay absolute and are expected to match exactly — that is
# the ABI check doing its job, not a bug.
base_dir = /home

# Keep the current working directory out of the hash, for the same reason.
hash_dir = false

# --- shared cache (opt-in) -------------------------------------------------
# Uncomment once the Talos deployment is up and you have the LoadBalancer
# address. Substitute the real host and credentials.
#
# The cluster half lives in its own GitOps repo, not here:
#   https://github.com/MdeRhoter/argocd-ccache
#
# Left commented deliberately: with an unreachable host every compile pays a
# connect timeout before falling back to local, which would make builds SLOWER
# on any machine that cannot see the cluster. See that repo's README for the
# deployment steps and for the cross-machine gotchas (compiler_check above is
# the one that silently costs you every remote hit).
#
# remote_storage = http://caelestia:PASSWORD@172.20.100.67/|connect-timeout=200|operation-timeout=5000
